{% extends 'base.html' %}

{% block title %}RDP — {{ server.name }}{% endblock %}
{% block content %}
<style>
.rdp-minimal { height: 100vh; display: flex; flex-direction: column; background: #09090b; }
.rdp-minimal .bar { padding: 6px 10px; background: rgba(17,17,21,0.95); border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; gap: 8px; }
.rdp-minimal .bar a { color: #9ca3af; font-size: 12px; }
.rdp-minimal #rdp-display { flex: 1; min-height: 0; }
.rdp-minimal .connect-bar { padding: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rdp-minimal .connect-bar input { padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.06); color: #fff; width: 200px; }
.rdp-minimal .connect-bar button { padding: 6px 14px; background: #6366f1; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
</style>
<div class="rdp-minimal">
    <div class="bar">
        <a href="{% url 'servers:server_list' %}">← Servers</a>
        <span id="rdp-status" style="font-size:12px;color:#6b7280">Disconnected</span>
    </div>
    <div class="connect-bar" id="rdp-connect-panel">
        <input type="password" id="rdp-master-password" placeholder="Master password">
        <input type="password" id="rdp-password" placeholder="RDP password (optional)">
        <input type="text" id="rdp-domain" placeholder="Domain (optional)">
        <button type="button" id="rdp-connect-btn">Connect</button>
    </div>
    <div id="rdp-display"></div>
</div>
<script type="module">
(function() {
    const serverId = {{ server.id }};
    const wsUrl = (window.location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + window.location.host + '/ws/servers/' + serverId + '/rdp/';
    const statusEl = document.getElementById('rdp-status');
    const panelEl = document.getElementById('rdp-connect-panel');
    const connectBtn = document.getElementById('rdp-connect-btn');
    const displayEl = document.getElementById('rdp-display');
    const masterPasswordEl = document.getElementById('rdp-master-password');
    const passwordEl = document.getElementById('rdp-password');
    const domainEl = document.getElementById('rdp-domain');
    let lastError = '';
    let activeWs = null;

    function setStatus(text, color) {
        statusEl.textContent = text;
        statusEl.style.color = color || '#6b7280';
    }

    function showError(message) {
        const msg = message || 'Unknown RDP error';
        lastError = msg;
        setStatus('Error: ' + msg, '#ef4444');
        panelEl.style.display = 'flex';
        connectBtn.disabled = false;
    }

    function closeActiveWs() {
        if (!activeWs) return;
        try {
            if (activeWs.readyState === WebSocket.OPEN || activeWs.readyState === WebSocket.CONNECTING) {
                activeWs.close();
            }
        } catch (e) {}
        activeWs = null;
    }

    async function connect() {
        closeActiveWs();
        lastError = '';
        connectBtn.disabled = true;
        setStatus('Connecting…');
        const masterPassword = (masterPasswordEl && masterPasswordEl.value) || '';
        const password = (passwordEl && passwordEl.value) || '';
        const domain = (domainEl && domainEl.value) || '';
        try {
            const Guacamole = (await import('https://cdn.jsdelivr.net/npm/guacamole-common-js@1.5.0/dist/esm/guacamole-common.js')).default;
            let tunnel = null;
            const ws = new WebSocket(wsUrl);
            activeWs = ws;
            ws.binaryType = 'arraybuffer';
            ws.onopen = () => ws.send(JSON.stringify({
                master_password: masterPassword,
                password: password,
                domain: domain
            }));
            ws.onmessage = function(ev) {
                let data = ev.data;
                if (data instanceof ArrayBuffer) data = new TextDecoder().decode(data);
                if (typeof data !== 'string') return;
                const trimmed = data.trim();
                if (trimmed.charAt(0) === '{') {
                    try {
                        const j = JSON.parse(data);
                        if (j.error) {
                            const code = j.code ? (' [' + j.code + ']') : '';
                            showError(j.error + code);
                        }
                    } catch (e) {
                        showError('Invalid error payload');
                    }
                    return;
                }
                if (!tunnel) {
                    tunnel = new Guacamole.Tunnel();
                    tunnel.connect = function() {};
                    tunnel.sendMessage = function() {
                        if (ws.readyState !== WebSocket.OPEN || !arguments.length) return;
                        var parts = [];
                        for (var i = 0; i < arguments.length; i++) {
                            var s = String(arguments[i]);
                            parts.push(s.length + "." + s);
                        }
                        ws.send(parts.join(",") + ";");
                    };
                    tunnel.uuid = null;
                    tunnel.disconnect = () => ws.close();
                    var parser = new Guacamole.Parser();
                    parser.oninstruction = function(opcode, args) {
                        if (tunnel.uuid === null) {
                            if (opcode === Guacamole.Tunnel.INTERNAL_DATA_OPCODE && args.length === 1)
                                tunnel.setUUID(args[0]);
                            tunnel.setState(Guacamole.Tunnel.State.OPEN);
                        }
                        if (opcode !== Guacamole.Tunnel.INTERNAL_DATA_OPCODE && tunnel.oninstruction)
                            tunnel.oninstruction(opcode, args);
                    };
                    tunnel._parser = parser;
                    const client = new Guacamole.Client(tunnel);
                    displayEl.innerHTML = '';
                    displayEl.appendChild(client.getDisplay().getElement());
                    client.getDisplay().showCursor(true);
                    client.connect();

                    client.onerror = (status) => {
                        const msg = (status && (status.message || status.code)) || 'Guacamole error';
                        showError(msg);
                    };

                    client.onstatechange = (s) => {
                        if (s === Guacamole.Client.State.WAITING) {
                            panelEl.style.display = 'flex';
                            setStatus('Authorizing…');
                        } else if (s === Guacamole.Client.State.CONNECTED) {
                            panelEl.style.display = 'none';
                            setStatus('Connected', '#10b981');
                        } else if (s === Guacamole.Client.State.DISCONNECTING) {
                            setStatus('Disconnecting…');
                        } else if (s === Guacamole.Client.State.DISCONNECTED) {
                            if (!lastError) setStatus('Disconnected');
                            panelEl.style.display = 'flex';
                            connectBtn.disabled = false;
                        }
                    };
                }
                try {
                    tunnel._parser.receive(data);
                } catch (e) {
                    showError('Protocol parse error');
                    console.error('RDP parse', e);
                }
            };
            ws.onclose = (ev) => {
                if (!lastError) {
                    if (ev && ev.code && ev.code !== 1000) {
                        const suffix = ev.reason ? (': ' + ev.reason) : '';
                        setStatus('Disconnected (' + ev.code + suffix + ')', '#ef4444');
                    } else {
                        setStatus('Disconnected');
                    }
                }
                panelEl.style.display = 'flex';
                connectBtn.disabled = false;
                if (activeWs === ws) activeWs = null;
            };
            ws.onerror = () => { if (!lastError) showError('Connection error'); };
        } catch (e) {
            showError(e.message || 'Load failed');
        }
    }
    connectBtn.addEventListener('click', connect);
})();
</script>
{% endblock %}
