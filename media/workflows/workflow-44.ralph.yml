cli:
  backend: "cursor"
event_loop:
  completion_promise: "LOOP_COMPLETE"
  max_iterations: 50
  starting_event: "task.start"
hats:
  step_1:
    name: "Проверка логов на ошибки"
    description: "Проверка логов на ошибки"
    triggers: ["task.start"]
    publishes: ["step_1.done"]
    instructions: "Execute via server_execute on server lunix: проверь системные логи (journalctl -p err, /var/log/syslog, /var/log) на наличие ошибок. Выведи найденные ошибки и краткий отчёт. Output <promise>STEP_DONE</promise> when done"