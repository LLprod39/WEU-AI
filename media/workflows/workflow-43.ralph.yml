cli:
  backend: "cursor"
event_loop:
  completion_promise: "LOOP_COMPLETE"
  max_iterations: 50
  starting_event: "task.start"
hats:
  step_1:
    name: "Pull and run Ollama Docker container"
    description: "Pull and run Ollama Docker container"
    triggers: ["task.start"]
    publishes: ["step_1.done"]
    instructions: "Execute via server_execute on server lunix: 1) docker pull ollama/ollama 2) docker run -d --name ollama -v ollama:/root/.ollama -p 11434:11434 --restart unless-stopped ollama/ollama. Verify container is running with docker ps. Output <promise>STEP_DONE</promise> when done"