cli:
  backend: "cursor"
event_loop:
  completion_promise: "LOOP_COMPLETE"
  max_iterations: 50
  starting_event: "task.start"
hats:
  step_1:
    name: "Проверить место на дисках"
    description: "Проверить место на дисках"
    triggers: ["task.start"]
    publishes: ["step_1.done"]
    instructions: "Execute via server_execute with server_name_or_id="lunix": run df -h and lsblk to check disk space. Output <promise>STEP_DONE</promise> when done"
  step_2:
    name: "Проверить логи на ошибки"
    description: "Проверить логи на ошибки"
    triggers: ["step_1.done"]
    publishes: ["step_2.done"]
    instructions: "Execute via server_execute with server_name_or_id="lunix": check system logs for errors (journalctl -p err -n 50, dmesg, or /var/log/*.log). Output <promise>STEP_DONE</promise> when done"